version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/SGuard.DataAnnotations"
      - "/SGuard.DataAnnotations.Tests"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
